<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Logs – InsightPilot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white text-dark">

<div class="container mt-5">
  <h2 class="mb-4">📜 File Upload Logs – InsightPilot</h2>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Message</th>
        <th>Status</th>
        <th>Type</th>
        <th>File Name</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody>
      {% for row in logs %}
      <tr>
        <td>{{ row[4] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[0] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="/" class="btn btn-secondary mt-3">← Back to Upload</a>
</div>

</body>
</html>
