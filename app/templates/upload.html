<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InsightPilot | Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <section class="flex flex-col items-center justify-center min-h-screen px-4">
    <div class="bg-white shadow-xl rounded-xl p-8 max-w-md w-full text-center">
      <h1 class="text-4xl font-extrabold mb-2 text-indigo-700">InsightPilot</h1>
      <p class="text-sm text-gray-500 mb-6">Upload your log file to generate insights & visual reports</p>

      {% if message %}
      <div class="bg-indigo-100 border border-indigo-300 text-indigo-700 px-4 py-2 rounded mb-4">
        {{ message }}
      </div>
      {% endif %}

      <form action="/upload" method="post" enctype="multipart/form-data" class="space-y-4">
        <input type="file" name="file" class="block w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded">
          Upload & Analyze
        </button>
      </form>

      {% if show_download %}
      <div class="mt-4 space-x-2">
        <a href="/analysis_reports/{{ report_path }}" class="text-indigo-600 underline">Download Analysis CSV</a>
        <a href="/analysis_reports/{{ summary_path }}" class="text-indigo-600 underline">Download Summary CSV</a>
      </div>
      {% endif %}
    </div>
  </section>

  {% if issues %}
  <section class="max-w-4xl mx-auto py-10 space-y-8">
    <div class="bg-white shadow-md rounded-lg p-4">
      <div id="plotly-severity"></div>
    </div>
    <div class="bg-white shadow-md rounded-lg p-4">
      <div id="plotly-level"></div>
    </div>
    <div class="bg-white shadow-md rounded-lg p-4">
      <div id="plotly-cluster"></div>
    </div>
  </section>

  <script>
    const issues = {{ (issues | default([])) | tojson }};
    if (issues.length > 0) {
      const ts = issues.map(i => i.timestamp);
      const sev = issues.map(i => i.severity_score);
      const cl = issues.map(i => i.cluster);
      const an = issues.map(i => i.anomaly);
      const levels = issues.map(i => i.level);

      // Severity + Anomalies timeline
      Plotly.newPlot('plotly-severity', [
        {
          x: ts,
          y: sev,
          mode: 'lines+markers',
          name: 'Severity',
          line: { color: '#9ca3af', width: 3 }
        },
        {
          x: ts.filter((_, i) => an[i] === -1),
          y: sev.filter((_, i) => an[i] === -1),
          mode: 'markers',
          name: 'Anomalies',
          marker: { color: '#f87171', size: 10, symbol: 'x' }
        }
      ], {
        title: 'Severity and Anomalies Over Time',
        xaxis: { title: 'Timestamp' },
        yaxis: { title: 'Severity Score' }
      });

      // Log level frequency bar
      const levelCounts = {};
      levels.forEach(l => levelCounts[l] = (levelCounts[l] || 0) + 1);
      Plotly.newPlot('plotly-level', [{
        x: Object.keys(levelCounts),
        y: Object.values(levelCounts),
        type: 'bar',
        marker: { color: ['#fbbf24', '#60a5fa'] }
      }], {
        title: 'Log Level Frequency',
        xaxis: { title: 'Log Level' },
        yaxis: { title: 'Count' }
      });

      // Cluster distribution pie
      const clusterCounts = {};
      cl.forEach(c => clusterCounts[c] = (clusterCounts[c] || 0) + 1);
      Plotly.newPlot('plotly-cluster', [{
        values: Object.values(clusterCounts),
        labels: Object.keys(clusterCounts),
        type: 'pie',
        marker: {
          colors: ['#fcd34d', '#93c5fd', '#a7f3d0', '#fbcfe8', '#fde68a']
        }
      }], {
        title: 'Cluster Distribution'
      });
    }
  </script>
  {% endif %}
</body>
</html>
