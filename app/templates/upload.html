<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📤 InsightPilot File Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light text-dark">

  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-center text-primary">📤 Upload QA Files – InsightPilot</h2>

      <form action="{{ url_for('main.upload_file') }}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="file" class="form-label">Select File</label>
          <input class="form-control" type="file" name="file" id="file" required>
        </div>

        <div class="mb-3">
          <label for="filetype" class="form-label">File Type</label>
          <select class="form-select" name="filetype" id="filetype" required>
            <option value="">-- Select File Type --</option>
            <option value="log">Log File (.log, .txt)</option>
            <option value="image">Image File (.jpg, .png)</option>
            <option value="video">Video File (.mp4, .avi)</option>
          </select>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Upload</button>
        </div>

        <div class="d-grid">
          <a href="/task-logs" class="btn btn-primary">View Task Logs</a>
        </div>
      </form>

      {% if message %}
        <div class="alert alert-info mt-4 text-center">{{ message }}</div>
      {% endif %}
    </div>
  </div>

</body>
</html>
